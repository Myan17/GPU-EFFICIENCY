global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "workload_simulator"
    static_configs:
      - targets: ["workload_simulator:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "optimization_engine"
    static_configs:
      - targets: ["optimization_engine:8001"]
    metrics_path: /metrics
    scrape_interval: 15s
